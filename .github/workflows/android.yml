name: Build Agent Fold APK
on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'ARCHITECTURE.md', 'docs/**']
  pull_request:
    paths-ignore: ['README.md', 'ARCHITECTURE.md', 'docs/**']
  workflow_dispatch:
concurrency:
  group: agentfold-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned Android platform
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.11.1'
      - name: Restore owner-managed development signing when provisioned
        if: github.ref == 'refs/heads/main'
        env:
          SIGNING_STORE_BASE64: ${{ secrets.AGENTFOLD_SIGNING_STORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_STORE_BASE64" ]; then
            umask 077
            printf '%s' "$SIGNING_STORE_BASE64" | base64 --decode > "$RUNNER_TEMP/agentfold-owner.keystore"
            printf 'AGENTFOLD_SIGNING_STORE_PATH=%s\n' "$RUNNER_TEMP/agentfold-owner.keystore" >> "$GITHUB_ENV"
          fi
      - name: Test, lint and compile
        id: validate
        env:
          AGENTFOLD_SIGNING_STORE_PASSWORD: ${{ github.ref == 'refs/heads/main' && secrets.AGENTFOLD_SIGNING_STORE_PASSWORD || '' }}
          AGENTFOLD_SIGNING_KEY_ALIAS: ${{ github.ref == 'refs/heads/main' && secrets.AGENTFOLD_SIGNING_KEY_ALIAS || '' }}
          AGENTFOLD_SIGNING_KEY_PASSWORD: ${{ github.ref == 'refs/heads/main' && secrets.AGENTFOLD_SIGNING_KEY_PASSWORD || '' }}
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest 2>&1 | tee build.log
      - name: Package verified outputs
        run: |
          set -euo pipefail
          mkdir -p deliverables
          cp app/build/outputs/apk/debug/app-debug.apk deliverables/AgentFold-v0.6.3-Recovery.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk deliverables/AgentFold-v0.6.3-androidTest.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs deliverables/AgentFold-v0.6.3-Recovery.apk | tee deliverables/signing-report.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging deliverables/AgentFold-v0.6.3-Recovery.apk > deliverables/package-report.txt
          git archive --format=zip HEAD -o deliverables/AgentFold-v0.6.3-source.zip
          if [ -n "${AGENTFOLD_SIGNING_STORE_PATH:-}" ]; then printf "owner-managed\n"; else printf "ephemeral-ci-only\n"; fi > deliverables/signing-mode.txt
          cp build.log deliverables/
          printf '%s\n' "$GITHUB_SHA" > deliverables/commit.txt
          cd deliverables
          sha256sum AgentFold-v0.6.3-Recovery.apk AgentFold-v0.6.3-source.zip AgentFold-v0.6.3-androidTest.apk > SHA256SUMS
      - name: Upload installable APK and source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: AgentFold-v0.6.3-${{ github.sha }}
          if-no-files-found: error
          retention-days: 90
          path: deliverables/
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: validation-${{ github.sha }}
          retention-days: 90
          path: |
            build.log
            app/build/reports/
            app/build/test-results/
      - name: Write build summary
        if: always()
        env:
          RESULT: ${{ steps.validate.outcome }}
        run: |
          printf '## Agent Fold validation\n\nCommit: %s\n\nUnit tests, lint and compilation: **%s**\n\nPhysical Fold tests: **NOT RUN**\n' "$GITHUB_SHA" "$RESULT" >> "$GITHUB_STEP_SUMMARY"
  emulator:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Download exact APKs and legacy release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          gh run download "$RUN_ID" --name "AgentFold-v0.6.3-$HEAD_SHA" --dir delivered
          gh release download v0.5.0 --pattern AgentFold-v0.5.0-debug.apk --dir legacy
      - name: Install pinned build tools
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0"'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install delivered APK alongside legacy and run instrumentation
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          cores: 2
          disable-animations: false
          script: bash ci/test-install.sh
      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: emulator-evidence-${{ github.sha }}
          retention-days: 90
          path: |
            install-evidence/
